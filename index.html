<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf8f5">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مدرستي اليابانية">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<title>مدرستي اليابانية</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Noto+Kufi+Arabic:wght@600;700&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+JP:wght@500&display=swap" rel="stylesheet">
<style>
/*
VOICE: calm, warm private Japanese school; patient teacher.
IDEA: a washi-paper practice notebook beside a sakura branch, with the hinomaru sun.
PICTURE: Japan flag sun on the hero, sakura branches at both page edges, falling petals.
COLOUR and TYPE: washi white, hinomaru red #bc002d, sakura pink; Noto Kufi titles, Noto Sans Arabic body, Klee One for Japanese.
LAYOUT: centered column up to 1100px; lesson as one focused card per step; stacks on phones with bottom nav.
*/
:root{color-scheme:light;--bg:#fbf8f5;--paper:#fff;--ink:#231c1f;--mute:#7c6b70;--red:#bc002d;--red2:#9d0026;--pink:#f7b7c8;--pink2:#fde9ef;--line:#f0dfe3;--ok:#2e9c6a;--gold:#c99a2e}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);background-image:radial-gradient(circle at 20% 0%,#fde9ef 0,transparent 40%),radial-gradient(circle at 100% 60%,#fdf0f3 0,transparent 35%);color:var(--ink);font:17px/1.75 'Noto Sans Arabic',system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:'Noto Kufi Arabic','Noto Sans Arabic',sans-serif;line-height:1.3;margin:0;text-wrap:balance}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.jp{font-family:'Klee One','Noto Sans JP',sans-serif;font-weight:600}
:focus-visible{outline:3px solid #e2557a;outline-offset:2px}
svg{display:block}
/* deco */
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.branch{position:absolute;top:-10px;right:-20px;width:min(220px,22vw);opacity:.9}
.branch.flip{right:auto;left:-20px;transform:scaleX(-1);top:auto;bottom:-120px}
.petals i{position:absolute;top:-30px;left:var(--x);width:12px;height:10px;background:var(--pink);border-radius:12px 0 12px 0;opacity:.75;animation:fall var(--s) linear var(--d) infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-80px,110vh) rotate(540deg)}}
/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px max(3vw,14px);background:#fffffff0;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0}
.logo .lg{width:40px;height:40px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 2px 8px #bc002d14}.logo .lg i{width:18px;height:18px;border-radius:50%;background:var(--red)}
.logo b{font-family:'Noto Kufi Arabic';font-size:18px}.logo .jp{color:var(--red);font-size:14px}
.tnav{display:flex;gap:4px;margin-inline-start:auto}
.tnav button{display:flex;align-items:center;gap:6px;border:0;background:none;padding:8px 12px;border-radius:10px;color:var(--mute);font-weight:600;min-height:44px}
.tnav button svg{width:20px;height:20px}.tnav button.on{background:var(--pink2);color:var(--red)}
.xp{display:flex;align-items:center;gap:6px;background:var(--pink2);border-radius:30px;padding:4px 6px 4px 14px}.xp b{color:var(--red);font-size:18px}.xp small{color:var(--mute)}.xp .lvl{background:var(--red);color:#fff;border-radius:20px;padding:2px 10px;font-family:'Klee One';font-weight:600;font-size:14px}
.bnav{display:none}
.main{position:relative;z-index:1;max-width:1100px;margin:auto;padding:26px 20px 80px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:14px;border:1px solid var(--line);background:#fff;font-weight:700;transition:transform .15s,box-shadow .2s,background .2s}
.btn svg{width:18px;height:18px}.btn:active{transform:scale(.97)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 6px 18px #bc002d33}.btn.red:hover{background:var(--red2)}
.btn.ghost:hover{background:var(--pink2)}
.btn.big{font-size:19px;min-height:56px;padding:0 30px}.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.pulse{animation:pulse 1.6s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 #bc002d55}70%{box-shadow:0 0 0 12px #bc002d00}}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--mute);font-weight:600;padding:6px 0;min-height:40px}.back svg{width:18px;height:18px}
.fine{color:var(--mute);font-size:14.5px}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 20px 50px #bc002d10;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset:auto -60px -80px auto;width:260px;height:260px;border-radius:50%;background:var(--pink2);z-index:0}
.htext,.hart{position:relative;z-index:1}
.kicker{color:var(--red);font-weight:700;margin:0}
.hero h1{font-size:clamp(30px,4.4vw,48px);margin:6px 0 10px}
.welcome{color:#4b3c41;max-width:34em;margin:0 0 20px}
.hact{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.nextl{color:var(--mute);font-size:15px}.donebig{color:var(--red);font-size:20px}
.hart{display:grid;place-items:center}.flag{filter:drop-shadow(0 16px 30px #bc002d33);border-radius:8px;animation:wave 6s ease-in-out infinite;max-width:100%}
@keyframes wave{50%{transform:rotate(-2deg) translateY(-4px)}}
.sun-jp{font-family:'Klee One';font-size:22px;letter-spacing:.4em;color:var(--red);margin-top:10px}
/* stats */
.stats{display:grid;grid-template-columns:1.6fr repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;justify-content:center}
.stat b{font-size:28px;color:var(--red);font-family:'Noto Kufi Arabic';line-height:1.2}.stat small{color:var(--mute)}
.stat.big{flex-direction:row;align-items:center;gap:14px}.stat.big b{font-size:18px;color:var(--ink)}
.ring{width:86px;height:86px;flex:none}.ring text{font:700 20px 'Noto Kufi Arabic';fill:var(--red)}
/* teacher */
.teacher{display:flex;gap:14px;align-items:flex-start;margin:16px 0}
.tav{flex:none;width:78px;text-align:center}.tav small{display:block;font-size:12px;color:var(--red);font-weight:700;line-height:1.3}
.sensei{width:78px;height:86px;background:var(--pink2);border-radius:50%;border:3px solid #fff;box-shadow:0 4px 14px #bc002d22}
.bubble{position:relative;flex:1;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 18px;box-shadow:0 6px 18px #0000000a}
.bubble::before{content:'';position:absolute;top:24px;right:-9px;width:16px;height:16px;background:#fff;border-right:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.bubble p{margin:0 0 8px}.bubble p:last-child{margin:0}
.sec-t{display:flex;align-items:center;gap:12px;font-size:22px;margin:30px 0 14px}.sec-t i{flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--pink))}
/* section cards */
.secs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.seccard{text-align:start;background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;transition:.2s}
.seccard::before{content:'';position:absolute;inset:0 0 auto 0;height:5px;background:var(--sc)}
.seccard:hover{transform:translateY(-4px);box-shadow:0 14px 30px #bc002d18}
.seccard .sj{font-family:'Klee One';font-size:40px;color:var(--sc);line-height:1.1}.seccard b{font-size:20px;font-family:'Noto Kufi Arabic'}.seccard small{color:var(--mute);font-size:14.5px;line-height:1.5}
.seccard em{font-style:normal;font-size:14px;color:var(--mute);display:flex;align-items:center;gap:6px}.seccard em svg{width:14px;height:14px}
.seccard.locked{opacity:.65}
.bar{display:block;height:8px;background:var(--pink2);border-radius:8px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#e2557a);border-radius:8px;transition:width .6s}
.prgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.prc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.prc>b{display:block;margin-bottom:10px;font-size:17px}.prc>b .jp{color:var(--red)}
.prc>div{display:flex;gap:6px}
.lvlbtn{flex:1;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 4px;font-weight:700;min-height:46px}
.l-easy{--lc:#2e9c6a}.l-mid{--lc:#c99a2e}.l-hard{--lc:#bc002d}
.lvlbtn{color:var(--lc)}.lvlbtn:hover{background:var(--lc);color:#fff}
.prgrid.big .prc{display:flex;flex-direction:column;gap:8px}
.lvlrow{display:flex;flex-direction:column;align-items:flex-start;text-align:start;border:1px solid var(--line);border-inline-start:5px solid var(--lc);border-radius:12px;background:#fff;padding:10px 14px}.lvlrow b{color:var(--lc)}.lvlrow small{color:var(--mute)}.lvlrow:hover{background:var(--pink2)}
/* section page */
.sechead{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:16px;align-items:center;margin-bottom:18px}
.sechead .back{grid-column:1/-1}
.sechead .sj{font-family:'Klee One';font-size:56px;color:var(--sc);background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 18px;line-height:1.3}
.sechead h1{font-size:32px}.sechead p{margin:2px 0 0;color:var(--mute)}
.lessons{list-style:none;padding:0;margin:0;display:grid;gap:10px;counter-reset:l}
.lrow{width:100%;display:flex;align-items:center;gap:14px;text-align:start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;transition:.2s}
.lrow:hover{border-color:var(--pink)}.lrow.locked{opacity:.55}
.lrow.cur{border-color:var(--red);box-shadow:0 8px 24px #bc002d18}
.ln{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--pink2);color:var(--red)}.ln svg{width:20px;height:20px}
.lrow.done .ln{background:var(--ok);color:#fff}.lrow.cur .ln{background:var(--red);color:#fff}
.lt{flex:1;display:flex;flex-direction:column}.lt small{color:var(--mute);font-size:17px;letter-spacing:.05em}
.lv{font-style:normal;font-size:12px;background:var(--pink2);color:var(--red);border-radius:10px;padding:0 8px;align-self:flex-start}
.lm{display:flex;flex-direction:column;align-items:flex-end;gap:2px}.lm small{display:flex;gap:4px;align-items:center;color:var(--mute);font-size:12.5px}.lm small svg{width:14px;height:14px}
.lm em{font-style:normal;font-weight:700}.lm .go{color:var(--red)}.lm .best{color:var(--ok)}
/* lesson */
.lesson{position:relative;z-index:1;max-width:900px;margin:auto;padding:0 16px 60px}
.lhead{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:12px 0;background:var(--bg)}
.lti{flex:1;display:flex;flex-direction:column;line-height:1.3}.lti small{color:var(--red);font-weight:700}.lti b{font-family:'Noto Kufi Arabic';font-size:18px}
.timer{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:30px;padding:6px 12px;font-size:14px;position:relative;overflow:hidden;font-variant-numeric:tabular-nums}.timer svg{width:16px;height:16px;color:var(--red)}
.timer i{position:absolute;inset:auto 0 0 auto;height:3px;width:var(--p);background:var(--red)}
.lprog{height:6px;background:var(--pink2);border-radius:6px;overflow:hidden;margin-bottom:12px}.lprog i{display:block;height:100%;background:var(--red);transition:width .5s}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 14px 40px #bc002d0d;animation:cin .4s ease}
@keyframes cin{from{opacity:0;transform:translateY(10px)}}
.card>.teacher:first-child{margin-top:0}
.snav{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}.snav.start{justify-content:flex-start}
.snav .btn.red{min-width:150px}
.goals{background:var(--pink2);border-radius:16px;padding:14px 18px}.goals ul{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:8px 0}.goals li{background:#fff;border-radius:10px;padding:4px 12px;font-size:20px}.goals li .jp{color:var(--red);font-size:22px}
.lgrid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}
.bigch{position:relative;background:#fff;border:2px solid var(--line);border-radius:22px;aspect-ratio:1;display:grid;place-items:center;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:50% 50%;background-position:center}
.bigch .k{font-size:130px;line-height:1;color:var(--ink)}
.bigch.inline{width:150px}.bigch.inline .k{font-size:90px}
.spk{width:44px;height:44px;border-radius:50%;border:0;background:var(--red);color:#fff;display:inline-grid;place-items:center;flex:none;box-shadow:0 4px 12px #bc002d44;transition:transform .15s}.spk svg{width:22px;height:22px}.spk:active{transform:scale(.9)}
.spk.big{position:absolute;bottom:-14px;left:-14px;width:54px;height:54px}
.spk.huge{width:96px;height:96px;margin:10px auto}.spk.huge svg{width:44px;height:44px}
.facts{display:grid;gap:10px}
.fact{background:var(--bg);border-radius:14px;padding:10px 14px}.fact small{color:var(--mute);display:block;font-size:13px}
.fact .ar{font-size:30px;color:var(--red);font-family:'Noto Kufi Arabic'}.fact .rom{font-size:22px;letter-spacing:.05em;direction:ltr;display:inline-block}.fact .mean{font-size:26px;color:var(--red)}
.fact p{margin:0}.fact.mn{background:#fff8e8}.fact.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fact.two .jp{font-size:24px;display:block}.fact.two .ar{font-size:16px;color:var(--ink)}
.exw{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}.exw>.jp{font-size:26px}.exw .spk{width:36px;height:36px}.exw .spk svg{width:18px;height:18px}.jp.sm{font-size:16px;color:var(--mute)}
.rowgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.rowgrid.yoon{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.rcell{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px 6px}.rcell:hover{background:var(--pink2)}
.rcell .jp{font-size:42px;line-height:1.2}.rcell b{color:var(--red)}.rcell small{color:var(--mute);direction:ltr}.rcell em{font-style:normal;font-size:12px;color:var(--mute);text-align:center;line-height:1.4}.rcell em .jp{font-size:14px}
/* demo paper */
.paper{width:min(340px,80vw);margin:8px auto;padding:12px;background:#fff;border-radius:6px;box-shadow:0 2px 0 #eee,0 12px 30px #0000001a;transform:rotate(-.6deg)}
.paper.sm{width:200px;margin:0}
.demo{width:100%;height:auto}
.demo .ghost path{fill:none;stroke:#ece4e6;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transition:opacity .4s}
.demo .ink path{fill:none;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}.demo .ink .red{stroke:#bc002d}.demo .ink .black{stroke:#1d1a1c;stroke-width:4.8}
.demo .nums text{font-size:7px;fill:#bc002d;font-weight:700;font-family:sans-serif}
.dctl{display:flex;justify-content:center;gap:10px;align-items:center}
/* pad */
.padwrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start;justify-content:center}
.padhost{width:100%}
.pad{position:relative;width:100%;aspect-ratio:1;border-radius:6px;box-shadow:0 2px 0 #eee,0 12px 30px #0000001a;background:#fff;touch-action:none}
.pad svg,.pad canvas{position:absolute;inset:0;width:100%;height:100%}
.pad canvas{cursor:crosshair;touch-action:none}
.padbg .tg path{fill:none;stroke:#e9dfe2;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.padbg .tn text{font-size:6.5px;fill:#e2557a;font-family:sans-serif;font-weight:700}
.padbg .ans path{fill:none;stroke:#bc002d;stroke-opacity:.35;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.padside{display:flex;flex-direction:column;gap:8px}
.score b{font-size:42px;font-family:'Noto Kufi Arabic'}.ok{color:var(--ok)}.no{color:var(--red)}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center}.qhead span{color:var(--mute);font-variant-numeric:tabular-nums}
.qdots{display:flex;gap:6px;margin:10px 0 4px}.qdots i{flex:1;height:6px;border-radius:6px;background:var(--pink2)}.qdots i.d{background:var(--pink)}.qdots i.c{background:var(--red)}
.qprompt{text-align:center;padding:12px 0}.qprompt p{margin:0;color:var(--mute)}
.qbig{font-size:84px;line-height:1.3}.qbig.ar{font-size:44px;color:var(--red);font-family:'Noto Kufi Arabic'}.rom{direction:ltr;display:inline-block;color:var(--mute)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{min-height:64px;border:2px solid var(--line);border-radius:16px;background:#fff;font-size:20px;font-weight:600;padding:10px;transition:.15s}.opt .jp{font-size:34px}.opt small{color:var(--mute);font-size:14px;direction:ltr;display:inline-block}
.opt:hover:not(.done){border-color:var(--pink);background:var(--pink2)}
.opt.right{border-color:var(--ok);background:#e6f6ee}.opt.wrong{border-color:var(--red);background:#fde8ec;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.qfb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;min-height:10px}.qfb .jp{font-size:22px}.qfb .btn{margin-inline-start:auto}
/* words */
.words{display:grid;gap:8px}
.wrow{display:grid;grid-template-columns:auto auto auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--bg)}
.wj{font-size:28px}.wr{color:var(--mute);font-size:16px}.war b{color:var(--red);display:block;line-height:1.3}.war small{color:var(--mute);direction:ltr;display:inline-block}.wm{font-weight:600;text-align:end}
/* build */
.bans,.btiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:64px;padding:12px;border-radius:14px}
.bans{background:var(--pink2);border:2px dashed var(--pink)}.bans .ph{color:var(--mute);font-family:'Noto Sans Arabic';font-weight:400}
.tile{font-size:24px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px 14px;box-shadow:0 3px 0 var(--line)}.tile.in{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 3px 0 var(--red2)}.tile.ghost{opacity:.25}
/* write */
.wtask{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;margin:6px 0 14px}.wtask .ar{font-size:26px;color:var(--red)}.wtask small{direction:ltr;color:var(--mute)}
.hidew{font-size:28px;opacity:0;transition:.3s}.hidew.show{opacity:1}
.genko{display:flex;flex-wrap:wrap;gap:0;justify-content:center;direction:ltr;border:2px solid #e9b9c4;border-radius:4px;width:max-content;max-width:100%;margin:auto}
.genko .cell{width:min(130px,calc((100vw - 90px)/3));border:1px solid #f0cdd5}
.genko .cell.bad{box-shadow:inset 0 0 0 3px #bc002d66}
.genko .pad{border-radius:0;box-shadow:none}
/* done */
.done{text-align:center;position:relative;overflow:hidden}
.confetti i{position:absolute;top:-10px;left:var(--x);width:10px;height:8px;border-radius:10px 0 10px 0;background:var(--pink);animation:conf 2.4s var(--d) ease-in forwards}.confetti i:nth-child(3n){background:var(--red)}
@keyframes conf{to{transform:translateY(420px) rotate(400deg);opacity:0}}
/* pages */
.pagehead{margin-bottom:16px}.pagehead h1{font-size:30px}.pagehead p{color:var(--mute);margin:4px 0 0}
.revlist{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}

  const L = lessonOf(sec, i), chars = lessonChars(sec, i), steps = [{ t: 'intro' }];
  if (sec === 'kanji') {
    chars.forEach((k, n) => { steps.push({ t: 'learnK', item: k }, { t: 'demo', ch: k.ch }, { t: 'trace', ch: k.ch }, { t: 'free', ch: k.ch }); if (n % 3 === 2 && n < chars.length - 1) steps.push({ t: 'check', upto: n }); });
  } else if (L.group) {
    const rows = []; for (let k = 0; k < chars.length; k += 5) rows.push(chars.slice(k, k + 5));
    rows.forEach(r => { steps.push({ t: 'row', items: r }); const rep = r.find(x => !'ぢづヂヅ'.includes(x.ch)) || r[0]; steps.push({ t: 'demo', ch: rep.ch }, { t: 'trace', ch: rep.ch }, { t: 'free', ch: rep.ch }); });
    steps.push({ t: 'check', upto: chars.length - 1 });
  } else {
    chars.forEach((c, n) => { steps.push({ t: 'learn', item: c }, { t: 'demo', ch: c.ch }, { t: 'trace', ch: c.ch }, { t: 'free', ch: c.ch }); if (n % 2 === 1 && n < chars.length - 1 && !SMALL[c.ch]) steps.push({ t: 'check', upto: n }); });
    if (L.yoon) steps.push({ t: 'yoon', items: L.yoon.map(kanaItem) });
  }
  if (L.phrases || L.sentences) lessonWords(sec, i).forEach(w => steps.push({ t: 'learnW', item: w }));
  steps.push({ t: 'words' });
  if (L.sentences || (sec === 'kanji' && KANJI_SENTENCES[i])) steps.push({ t: 'build' });
  steps.push({ t: 'drill', mode: 'read' }, { t: 'drill', mode: 'listen' }, { t: 'quiz' }, { t: 'write' }, { t: 'done' });
  return steps;
}
let TMR = null;

function pron(it) { return it.ar ? `${it.ar} <small>${esc(it.rom)}</small>` : esc(it.rom); }

  if (kind === 'mean') return { prompt: `<p>ما معنى هذا؟</p><div class="qbig jp">${esc(it.ch)}</div>`, opts: opts4(o => esc(o.mean), o => o.mean), it };
  if (kind === 'meanrev') return { prompt: `<p>اختر ما يعني:</p><div class="qbig ar">«${esc(it.mean)}»</div>`, opts: opts4(o => `<span class="jp">${esc(o.ch)}</span>`, o => o.ch), it };

function kindsFor(it, mode) {

  return `<div class="pagehead"><h1>جدول الحروف</h1><p>اضغط على أي حرف لتسمعه وتشاهد طريقة كتابته.</p></div>${tabs}${body}<p class="fine credit">بيانات ترتيب الضربات من مشروع KanjiVG للمطوّر Ulrich Apel، برخصة CC BY-SA 3.0.</p>`;
}
function charInfo(ch) {
  const kj = KANJI_LESSONS.flatMap(L => L.k).find(k => k[0] === ch); const it = kj ? kanjiItem(kj) : kanaItem(ch);
  openModal(`<button class="mx" data-a="close" aria-label="إغلاق">×</button><div class="cinfo"><div class="paper sm">${demoSvg(ch)}</div><div><div class="bigch inline"><span class="jp k">${ch}</span>${spk(kj ? kj[5][0][1] : ch, 'big')}</div>${kj ? `<p><b>${esc(it.mean)}</b></p><p class="fine">أون: <span class="jp">${toKata(it.on)}</span> · كون: <span class="jp">${esc(it.kun)}</span></p>` : `<p><b class="ar">${esc(it.ar)}</b> <small>${esc(it.rom)}</small></p>${it.mnem ? `<p class="fine">${bd(it.mnem)}</p>` : ''}`}<button class="btn ghost sm" data-a="replaymodal">${IC.loop} أعِد الكتابة</button></div></div>`, 'sm');
  const svg = modal.querySelector('.demo'); playDemo(svg, { red: true, numbers: true, ghost: true }); if (!kj) speak(ch);
}

/* ---------- ME ---------- */
function vMe() {
  const lv = level();
  return `<div class="pagehead"><h1>ملفي الشخصي</h1></div>
<section class="profile"><div class="pav">${AVT.draw(S.me, 'happy')}</div><div class="pinfo"><h2>${esc(S.name || 'طالب')}</h2><p>${S.age ? `العمر: ${esc(S.age)} سنة · ` : ''}${S.mins} دقيقة تعلّم</p>
<div class="lvline"><span class="lvb jp">${lv.l[1]}</span><div><b>المستوى ${lv.i + 1}: ${lv.l[2]}</b><span class="bar"><i style="width:${lv.pct * 100}%"></i></span><small>${S.xp} نقطة${lv.next ? ` · ${lv.next[0] - S.xp} نقطة إلى «${lv.next[2]}»` : ' · أعلى مستوى!'}</small></div></div>
<div class="pbtns"><button class="btn red" data-a="editav" data-id="me">صمّم شخصيتي</button><button class="btn ghost" data-a="editav" data-id="teacher">غيّر شكل ${S.teacher.g === 'm' ? 'المعلّم' : 'المعلّمة'}</button></div></div>
<div class="tcard">${AVT.draw(S.teacher.av, 'happy')}<b>${esc(S.teacher.name)}</b><small>${S.teacher.g === 'm' ? 'معلّمك' : 'معلّمتك'}</small></div></section>
<section class="stats"><div class="stat"><b>${S.stats.correct}</b><small>إجابة صحيحة</small></div><div class="stat"><b>${S.stats.answered ? Math.round(S.stats.correct / S.stats.answered * 100) : 0}%</b><small>دقة الإجابات</small></div><div class="stat"><b>${S.stats.writes}</b><small>حرف كتبته بيدك</small></div><div class="stat"><b>${S.streak.n || 0}</b><small>أيام متتالية</small></div></section>
<h2 class="sec-t"><span>الإنجازات</span><i></i></h2><div class="achs">${ACH.map(a => `<div class="ach ${S.ach.includes(a[0]) ? 'got' : ''}"><span class="am">${S.ach.includes(a[0]) ? '★' : '☆'}</span><b>${a[1]}</b><small>${a[2]}</small></div>`).join('')}</div>
<div class="snav start"><button class="btn ghost" data-a="resetask">بدء من جديد</button></div>`;
}
function editor() {
  const who = ui.edWho, d = ui.draft, O = AVT.OPT;
  const thumb = (k, v) => AVT.draw(Object.assign({}, d.av, { [k]: v }), 'happy');
  const grp = (title, k, list, mode) => `<div class="egrp"><h3>${title}</h3><div class="eopts ${mode === 'sw' ? 'swl' : 'th'}">${list.map(o => { const v = Array.isArray(o) ? o[0] : o, lab = Array.isArray(o) ? o[1] : ''; const on = d.av[k] === v; return mode === 'sw' ? `<button class="sw ${on ? 'on' : ''}" style="--c:${v}" data-a="setav" data-k="${k}" data-v="${v}" aria-label="${v}"></button>` : `<button class="eo ${on ? 'on' : ''}" data-a="setav" data-k="${k}" data-v="${v}">${thumb(k, v)}<small>${lab}</small></button>`; }).join('')}</div></div>`;
  return `<div class="pagehead"><button class="back" data-a="go" data-id="me">${IC.back} ملفي</button><h1>${who === 'me' ? 'صمّم شخصيتك' : 'شكل ' + (d.g === 'm' ? 'المعلّم' : 'المعلّمة')}</h1><p>شخصيات أنمي أصلية: اختر الشعر والعيون والملابس والإكسسوارات.</p></div>
<div class="editor"><div class="eprev"><div class="ebig">${AVT.draw(d.av, ui.edMood || 'happy')}</div><div class="moods">${[['happy', 'سعيد'], ['wow', 'مندهش'], ['sad', 'حزين']].map(([m, n]) => `<button class="${(ui.edMood || 'happy') === m ? 'on' : ''}" data-a="edmood" data-id="${m}">${n}</button>`).join('')}</div>
<div class="ebtns"><button class="btn red" data-a="saveav">حفظ</button><button class="btn ghost" data-a="rndav">شكل عشوائي</button><button class="btn ghost" data-a="defav">الافتراضي</button></div></div>
<div class="ectl">
${who === 'me' ? `<div class="egrp two"><label>اسمك<input id="ename" value="${esc(d.name)}" maxlength="24"></label><label>عمرك<input id="eage" type="number" min="4" max="99" inputmode="numeric" value="${esc(d.age)}"></label></div>` : `<div class="egrp two"><label>اسم ${d.g === 'm' ? 'المعلّم' : 'المعلّمة'}<input id="ename" value="${esc(d.name)}" maxlength="24"></label><div class="gsel"><span>المعلّم</span><div class="seg"><button class="${d.g === 'f' ? 'on' : ''}" data-a="setg" data-id="f">معلّمة</button><button class="${d.g === 'm' ? 'on' : ''}" data-a="setg" data-id="m">معلّم</button></div></div></div>`}
${grp('تسريحة الشعر', 'hair', O.hair, 'th')}${grp('لون الشعر', 'hairC', O.hairC, 'sw')}${grp('لون العينين', 'eye', O.eye, 'sw')}${grp('لون البشرة', 'skin', O.skin, 'sw')}${grp('الملابس', 'outfit', O.outfit, 'th')}${grp('لون الملابس', 'outC', O.outC, 'sw')}${grp('الإكسسوار', 'acc', O.acc, 'th')}${grp('لون الخلفية', 'bg', ['#fde9ef', '#e8f0ff', '#e9f7ef', '#fff4d6', '#efe7ff', '#1d1a1c'], 'sw')}
</div></div>`;
}
function openEditor(who) {
  ui.edWho = who; ui.edMood = 'happy';
  ui.draft = who === 'me' ? { name: S.name, age: S.age, av: Object.assign({}, S.me) } : { name: S.teacher.name, g: S.teacher.g, av: Object.assign({}, S.teacher.av) };
  ui.view = 'avatar'; history.replaceState(null, '', '#avatar'); app.innerHTML = shell(editor()); window.scrollTo(0, 0);
}
function syncEd() { const nm = $('#ename'), ag = $('#eage'); if (nm) ui.draft.name = nm.value; if (ag) ui.draft.age = ag.value; }
function redrawEditor() { const y = window.scrollY; app.innerHTML = shell(editor()); window.scrollTo(0, y); }
/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (e.target === modal) return closeModal();
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const a = el.dataset.a, id = el.dataset.id;
  const H = {
    go: () => go(id), say: () => speak(el.dataset.t), close: closeModal,
    sec: () => { if (!secOpen(id)) return toast('يُفتح قسم الكانجي بعد إكمال الدرس 10 من الهيراغانا', 'bad'); go('sec', id); },
    lesson: () => { closeModal(); openLesson(el.dataset.s, +el.dataset.i); },
    exitlesson: () => { stopTimer(); demoRun++; save(); ui.lesson = null; go('sec', ui.lastSec || 'hira'); },
    nextstep: nextStep, prevstep: prevStep,
    replay: () => { const svg = $('.demo'); playDemo(svg, { red: true, numbers: true, ghost: true }).then(ok => ok && playDemo(svg, { red: false, numbers: false, ghost: false, speed: 1.15 })); },
    replaymodal: () => playDemo(modal.querySelector('.demo'), { red: true, numbers: true, ghost: true }),
    undo: () => ui.lesson.state.pad.undo(), clear: () => ui.lesson.state.pad.clear(), checkpad: checkPad,
    peek: () => { const p = ui.lesson.state.pad; const h = $('#padhost .ans'); p.showAns(); setTimeout(() => { if (h) h.innerHTML = ''; }, 900); },
    retryquiz: () => renderStep(),
    gotostep: () => { const L = ui.lesson; const k = L.steps.findIndex(s => s.t === id); if (k >= 0) { L.lp.i = k; renderStep(); } },
    hintw: () => { const h = $('#hidew'); if (h) h.classList.toggle('show'); },
    practice: () => startPractice(el.dataset.s, el.dataset.d),
    startreview: startReview, charttab: () => { ui.chartTab = id; render(); }, charinfo: () => charInfo(id),
    editav: () => openEditor(id),
    setav: () => { syncEd(); ui.draft.av[el.dataset.k] = el.dataset.v; redrawEditor(); },
    edmood: () => { syncEd(); ui.edMood = id; redrawEditor(); },
    setg: () => { syncEd(); ui.draft.g = id; if (ui.draft.name === 'ساكورا سِنسِي' && id === 'm') { ui.draft.name = 'كينجي سِنسِي'; ui.draft.av = Object.assign({}, AVT.T0, { hair: 'short', acc: 'glasses', outfit: 'blazer', outC: '#2f5fb3' }); } else if (ui.draft.name === 'كينجي سِنسِي' && id === 'f') { ui.draft.name = 'ساكورا سِنسِي'; ui.draft.av = Object.assign({}, AVT.T0); } redrawEditor(); },
    rndav: () => { syncEd(); ui.draft.av = AVT.rnd(); redrawEditor(); },
    defav: () => { syncEd(); ui.draft.av = Object.assign({}, ui.edWho === 'me' ? AVT.ME0 : AVT.T0); redrawEditor(); },
    saveav: () => { const nm = ($('#ename') || {}).value, ag = ($('#eage') || {}).value; if (ui.edWho === 'me') { S.me = Object.assign({}, ui.draft.av); if (nm && nm.trim()) S.name = nm.trim().slice(0, 24); if (ag !== undefined) S.age = String(ag).replace(/[^0-9]/g, '').slice(0, 2); } else { S.teacher = { name: (nm && nm.trim()) || ui.draft.name, g: ui.draft.g, av: Object.assign({}, ui.draft.av) }; } save(); toast('تم الحفظ'); go('me'); },
    resetask: () => openModal(`<h3>البدء من جديد؟</h3><p>سيُمسح تقدّمك ونقاطك كلها. لا يمكن التراجع.</p><div class="snav"><button class="btn ghost" data-a="close">إلغاء</button><button class="btn red" data-a="resetok">امسح وابدأ</button></div>`, 'sm'),
    resetok: () => { const n = S.name; S = fresh(); S.name = n; save(); closeModal(); go('home'); }
  };
  if (a === 'sec') ui.lastSec = id; if (a === 'lesson') ui.lastSec = el.dataset.s;
  if (H[a]) H[a]();
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-f]'); if (!f) return; e.preventDefault();
  if (f.dataset.f === 'name') { S.name = $('#nm').value.trim().slice(0, 24) || 'طالب'; save(); closeModal(); render(); toast(`よろしく، ${S.name}!`); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });
function route() {
  const h = location.hash.slice(1); const m = /^lesson-(hira|kata|kanji)-(\d+)$/.exec(h);
  if (m) { ui.lastSec = m[1]; return openLesson(m[1], +m[2]); }
  const s = /^sec-(hira|kata|kanji)$/.exec(h); if (s) { ui.view = 'sec'; ui.arg = s[1]; ui.lastSec = s[1]; return render(); }
  ui.view = ['home', 'practice', 'review', 'chart', 'me'].includes(h) ? h : 'home'; render();
}
window.addEventListener('hashchange', () => { if (ui.view !== 'lesson') route(); });
window.__jp = { collectTexts, get S() { return S; }, get ui() { return ui; }, buildSteps, scoreDraw, arabic, romaji, nextStep };
route();
}
